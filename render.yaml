services:
  - type: web
    name: ghibliverse-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://ghibliverse-one.vercel.app
