name: Keep-alive

on:
  schedule:
    - cron: "0 6 * * 1,4" # Mon & Thu 06:00 UTC — well under Supabase's 7-day pause window
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend (touches Supabase via a real DB query)
        run: curl -fsS https://ghibliverse-api-production.up.railway.app/api/movies -o /dev/null
      - name: Ping frontend
        run: curl -fsS https://ghibliverse-one.vercel.app -o /dev/null
